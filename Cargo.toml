[package]
name = "lazygrafana"
version = "0.1.0"
edition = "2024"
description = "A lazygit-style terminal UI for operating Grafana"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guilherme-grimm/lazygrafana"
keywords = ["grafana", "tui", "observability", "prometheus", "loki"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
arboard = { version = "3", default-features = false }
similar = "3"
nucleo-matcher = "0.3"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
chrono = "0.4"
futures = "0.3"
open = "5"
base64 = "0.23"
unicode-width = "0.2"
urlencoding = "2"
tempfile = "3"
regex = "1"
textwrap = "0.16"
iana-time-zone = "0.1"
serde-saphyr = "2"

[dev-dependencies]
insta = "1"
wiremock = "0.6"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
