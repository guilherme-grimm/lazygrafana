apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Intentionally unreachable: exercises datasource health checks and query errors.
  - name: Broken Prometheus
    uid: broken
    type: prometheus
    access: proxy
    url: http://does-not-exist:9090
