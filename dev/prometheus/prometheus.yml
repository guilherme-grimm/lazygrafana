global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/demo-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  # load profile (targets are simply down when the profile isn't running)
  - job_name: avalanche
    static_configs:
      - targets: [avalanche:9001, avalanche-wide:9001]
